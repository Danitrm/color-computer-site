name: Verificar integridade COLOR COMPUTER
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do site
        uses: actions/checkout@v4
      - name: Verificar links, imagens e seguranca comercial
        run: |
          python3 scripts/check_site.py
          python3 -m py_compile scripts/check_public_site.py scripts/build_pages.py
          node --check scripts/audit_public_browser.cjs
      - name: Testar geracao de imagens otimizadas
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/build_pages.py
          test -f _site/index.html
          test -f _site/ascension_01_preto.png
          test -f _site/ascension_01_preto.webp
          grep -q 'type="image/webp"' _site/index.html
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout do site
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium para testes
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Testar jornada real no navegador
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/color-computer-http.log 2>&1 &
          node scripts/browser_smoke.cjs
          node scripts/browser_matrix.cjs
